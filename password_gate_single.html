<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>パスワードページ</title>
  <style>
    body {
      font-family: Arial, "游ゴシック", sans-serif;
      padding: 20px;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 8px;
    }
    .pw-wrapper {
      position: relative;
    }
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 8px 40px 8px 8px;
      margin-top: 8px;
      box-sizing: border-box;
    }
    .toggle-eye {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 14px;
      user-select: none;
      color: #555;
    }
    button {
      margin-top: 12px;
      padding: 8px 16px;
      cursor: pointer;
    }
    .error {
      color: red;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>パスワードを入力してください</h2>

    <form id="pwForm">
      <label for="pw">パスワード</label>

      <div class="pw-wrapper">
        <input type="password" id="pw" autocomplete="off">
        <span id="toggleEye" class="toggle-eye">👁</span>
      </div>

      <button type="submit">送信</button>
      <div id="error" class="error"></div>
    </form>
  </div>

  <script>
    // ▼ ここを書き換えて使う ▼
    const PASSWORD_HASH = 'a69231e861575c709752dcd85c62dc1addd6fa9834acbd9508e36abf88f82ea1';
    const DEST_URL = 'https://sites.google.com/view/yuta-room/home/yuta_love-1234';
    // ▲ ここまで ▲

    async function sha256(str) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      return hashHex;
    }

    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('pwForm');
      const pwInput = document.getElementById('pw');
      const errorDiv = document.getElementById('error');
      const toggleEye = document.getElementById('toggleEye');

      // パスワード表示／非表示
      toggleEye.addEventListener('click', function () {
        if (pwInput.type === 'password') {
          pwInput.type = 'text';
          toggleEye.textContent = '🙈';
        } else {
          pwInput.type = 'password';
          toggleEye.textContent = '👁';
        }
      });

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errorDiv.textContent = '';

        const pw = pwInput.value;
        if (!pw) {
          errorDiv.textContent = 'パスワードを入力してください。';
          return;
        }

        const hash = await sha256(pw);

        if (hash === PASSWORD_HASH) {
          // 正解 → Googleサイトのサブページへ
          window.location.href = DEST_URL;
        } else {
          // 不正解
          errorDiv.textContent = 'パスワードが違います。';
          pwInput.value = '';
          pwInput.focus();
        }
      });
    });
  </script>
</body>
</html>
